<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD Viewer</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="btn-sidebar" class="icon-btn" title="사이드바 보기/숨기기 (⌘/Ctrl+B)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="1.3" d="M1.5 2.5h13v11h-13z M5.5 2.5v11"/></svg>
        </button>
        <button id="btn-open" title="폴더 열기 (⌘/Ctrl+O)">폴더 열기</button>
        <button id="btn-new" title="새 문서 (⌘/Ctrl+N)">새 문서</button>
        <div id="doc-title"><span class="name">MD Viewer</span><span class="dirty" hidden>●</span></div>
        <button id="btn-save" title="저장 (⌘/Ctrl+S)">저장</button>
        <button id="btn-find" class="icon-btn" title="미리보기에서 찾기 (⌘/Ctrl+F)">
          <svg viewBox="0 0 16 16" width="15" height="15"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M7 2.5a4.5 4.5 0 1 1 0 9a4.5 4.5 0 0 1 0-9z M10.3 10.3l3.7 3.7"/></svg>
        </button>
        <button id="btn-export" class="icon-btn" title="내보내기 · 인쇄">
          <svg viewBox="0 0 16 16" width="15" height="15"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M8 2v8 M4.5 6.5L8 10l3.5-3.5 M2.5 11v2.5h11V11"/></svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="설정 (⌘/Ctrl+,)">
          <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path fill="none" stroke="currentColor" stroke-width="1.3" d="M8 1.5v2 M8 12.5v2 M1.5 8h2 M12.5 8h2 M3.4 3.4l1.4 1.4 M11.2 11.2l1.4 1.4 M3.4 12.6l1.4-1.4 M11.2 4.8l1.4-1.4"/></svg>
        </button>
        <button id="btn-editor" class="icon-btn" title="편집기 보기/숨기기 — 읽기 모드 (⌘/Ctrl+E)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="1.3" d="M1.5 2.5h13v11h-13z M8 2.5v11"/></svg>
        </button>
      </header>
      <main id="main">
        <aside id="sidebar">
          <nav class="side-tabs">
            <button data-panel="files" class="on">파일</button>
            <button data-panel="outline">목차</button>
            <button data-panel="recent">최근</button>
          </nav>
          <div class="side-panel" data-panel="files">
            <div class="explorer-head">
              <span class="explorer-title">열린 폴더 없음</span>
              <button id="btn-refresh" class="icon-btn" title="새로고침">
                <svg viewBox="0 0 16 16" width="14" height="14"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3"/></svg>
              </button>
            </div>
            <div class="explorer-tree">
              <div class="explorer-empty">
                <button id="btn-open-2">폴더 열기</button>
                <p>또는 폴더·파일을 창에 끌어다 놓으세요</p>
              </div>
            </div>
          </div>
          <div class="side-panel" data-panel="outline" hidden>
            <div class="outline-list"></div>
          </div>
          <div class="side-panel" data-panel="recent" hidden>
            <div class="recent-list"></div>
          </div>
        </aside>
        <div class="gutter" id="gutter-side"></div>
        <section id="workspace">
          <div id="tabbar"></div>
          <div id="panes">
            <section id="editor-pane"></section>
            <div class="gutter" id="gutter-mid"></div>
            <section id="preview-pane"><div id="preview-scroll"></div></section>
          </div>
        </section>
      </main>
    </div>
    <div id="lightbox" hidden><img alt="" /></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
