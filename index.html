<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD Viewer</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="btn-sidebar" class="icon-btn" title="탐색기 보기/숨기기 (⌘/Ctrl+B)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="1.3" d="M1.5 2.5h13v11h-13z M5.5 2.5v11"/></svg>
        </button>
        <button id="btn-open" title="폴더 열기 (⌘/Ctrl+O)">폴더 열기</button>
        <button id="btn-new" title="새 문서 (⌘/Ctrl+N)">새 문서</button>
        <div id="doc-title"><span class="name">환영합니다</span><span class="dirty" hidden>●</span></div>
        <button id="btn-save" title="저장 (⌘/Ctrl+S)">저장</button>
        <button id="btn-editor" class="icon-btn" title="편집기 보기/숨기기 — 읽기 모드 (⌘/Ctrl+E)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="1.3" d="M1.5 2.5h13v11h-13z M8 2.5v11"/></svg>
        </button>
      </header>
      <main id="main">
        <aside id="sidebar">
          <div class="explorer-head">
            <span class="explorer-title">열린 폴더 없음</span>
            <button id="btn-refresh" class="icon-btn" title="새로고침">
              <svg viewBox="0 0 16 16" width="14" height="14"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3"/></svg>
            </button>
          </div>
          <div class="explorer-tree">
            <div class="explorer-empty">
              <button id="btn-open-2">폴더 열기</button>
              <p>또는 폴더·파일을 창에 끌어다 놓으세요</p>
            </div>
          </div>
        </aside>
        <div class="gutter" id="gutter-side"></div>
        <section id="editor-pane"></section>
        <div class="gutter" id="gutter-mid"></div>
        <section id="preview-pane"><div id="preview-scroll"></div></section>
      </main>
    </div>
    <div id="lightbox" hidden><img alt="" /></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
